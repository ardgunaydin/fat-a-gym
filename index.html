<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FATaGYM</title>

  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/anatomy.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="site-header">
    <h1 class="site-title">FAT<span>a</span>GYM</h1>
  </header>

  <section class="hero">
    <h2>Your workout, your way</h2>
    <p>Pick a muscle, see the exercises, build your workout.</p>
    <a class="button" href="#anatomy-view">Start training</a>
  </section>

  <main class="layout">

    <section id="anatomy-view" aria-label="Body map"></section>

    <section id="filter-panel" aria-label="Filters"></section>

    <section id="exercise-list" aria-label="Exercises"></section>
      
    <section id="exercise-detail" aria-label="Exercise details"></section>
    
    <section id="empty-state" aria-live="polite"></section>

    <section id="workout-list" aria-label="My workout"></section>
  </main>

  <script src="js/storage.js" defer></script>
  <script src="js/exercises.js" defer></script>
  <script src="js/filters.js" defer></script>
  <script src="js/anatomy.js" defer></script>
  <script src="js/anatomy-view.js" defer></script>
  <script src="js/workout-builder.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
